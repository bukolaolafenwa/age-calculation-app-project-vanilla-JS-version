<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Age calculator app</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
 <main class="main-container">
    <section class="cal-card">

      <form id="ageForm">
        <div class="inputs">

          <div class="input-field">
            <label id="dayLabel" for="day">DAY</label>
            <input type="text" id="day" placeholder="DD" maxlength="2" />
            <p class="error" id="dayError"></p>
          </div>

          <div class="input-field">
            <label id="monthLabel" for="month">MONTH</label>
            <input type="text" id="month" placeholder="MM" maxlength="2" />
            <p class="error" id="monthError"></p>
          </div>

          <div class="input-field">
            <label id="yearLabel" for="year">YEAR</label>
            <input type="text" id="year" placeholder="YYYY" maxlength="4" />
            <p class="error" id="yearError"></p>
          </div>

        </div>

        <div class="divider">
          <hr />
          <button id="submitBtn" type="submit"><img src="./assets/images/icon-arrow.svg" /></button>
        </div>
      </form>

      <div class="result">
        <h1><span id="yearsResult">--</span> years</h1>
        <h1><span id="monthsResult">--</span> months</h1>
        <h1><span id="daysResult">--</span> days</h1>
      </div>

    </section>
  </main>
  <!-- Day
  DD

  Month
  MM

  Year
  YYYY

  -- years
  -- months
  -- days -->
  
<script src="./script.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
